name: build

on: [ push, pull_request ]

jobs:
  build_deploy:
    #if conditional to prevent a job from running
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: deploy release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: 1.8
      - name: gradle wrapper --gradle-version 6.7 --distribution-type all
        run: gradle wrapper
      # This action will create a github release and optionally upload an artifact to it.
      # https://github.com/ncipollo/release-action
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Gradle Test
        run: ./gradlew test
      - name: Gradle Build
        run: ./gradlew build
      - name: publish new version to github package
        run: ./gradlew publish
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        continue-on-error: true
      - name: Create a Release JAR
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: build/libs/*.jar
          commit: ${{ github.sha }}
          token: ${{ secrets.COMMIT_TOKEN }}
        continue-on-error: true